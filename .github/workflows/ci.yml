name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-python:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run unit tests
        run: PYTHONPATH=cli python3 -m pytest test/test_subnet.py -v

  test-cli:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    needs: test-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make test script executable
        run: chmod +x test/test_cli.sh

      - name: Run CLI integration tests
        run: bash test/test_cli.sh
